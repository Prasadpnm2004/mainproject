<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" font-family="Arial, sans-serif">
  <title>Alpha Sensitivity (Real-LLM Data)</title>
  <rect x="0" y="0" width="480" height="320" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="20" y="20" width="440" height="280" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="6,4" rx="6"/>
  <text x="240.0" y="128.0" font-size="14" text-anchor="middle" fill="#374151" font-weight="bold">Alpha Sensitivity (Real-LLM Data)</text>
  <text x="240.0" y="160.0" font-size="11" text-anchor="middle" fill="#6b7280">Alpha sensitivity data was derived from synthetic traces.</text>
  <text x="240.0" y="182.0" font-size="9" text-anchor="middle" fill="#9ca3af">Run: python -m experiments.run_sensitivity --n-attack 200 --n-benign 200 (real-LLM) to generate real alpha data.</text>
  <text x="240.0" y="208.0" font-size="9" text-anchor="middle" fill="#9ca3af">(Real data present — more samples needed for a curve)</text>
</svg>
